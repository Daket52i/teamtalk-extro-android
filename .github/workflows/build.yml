name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-root-directory: client
          cache-read-only: false

      - name: Compute version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' client/build.gradle | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/" | tr -d '[:space:]')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$VERSION_NAME" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build APKs
        working-directory: client
        run: |
          ./gradlew assembleDebug assembleRelease --build-cache --stacktrace 2>&1 | tee ../gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Brand APK names
        run: |
          mkdir -p dist
          for f in client/build/outputs/apk/release/*.apk client/build/outputs/apk/debug/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            newname=$(echo "$base" | sed "s/^TeamTalkAndroid/TeamTalkExtro-${VERSION_NAME}/")
            cp "$f" "dist/$newname"
          done
          ls -la dist

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkExtro-APK
          path: dist/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkExtro-${RELEASE_TAG}-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION_NAME) }}
          name: "TeamTalk Extro ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION_NAME) }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.apk
            tests/output/*.jar
            TeamTalkExtro-*-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
